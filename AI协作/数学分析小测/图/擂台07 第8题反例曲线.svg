<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420">
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#333}.t{font-size:15px;font-weight:bold}.s{font-size:11px;fill:#666}</style>
<defs><marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs>
<rect width="620" height="420" fill="#fff"/>
<text x="20" y="24" class="t">第 8 题反例：f(x) = sin²(5πx/2) − x</text>
<g stroke="#eee"><line x1="60" y1="50" x2="570" y2="50"/><line x1="60" y1="125" x2="570" y2="125"/><line x1="60" y1="275" x2="570" y2="275"/><line x1="60" y1="350" x2="570" y2="350"/></g>
<line x1="60" y1="40" x2="60" y2="360" stroke="#333"/>
<line x1="60" y1="200" x2="575" y2="200" stroke="#333"/>
<g class="s" text-anchor="end"><text x="52" y="54" class="s">1</text><text x="52" y="129" class="s">0.5</text><text x="52" y="204" class="s">0</text><text x="52" y="279" class="s">−0.5</text><text x="52" y="354" class="s">−1</text></g>
<g text-anchor="middle"><text x="160" y="216" class="s">0.2</text><text x="260" y="216" class="s">0.4</text><text x="360" y="216" class="s">0.6</text><text x="460" y="216" class="s">0.8</text><text x="560" y="216" class="s">1</text></g>
<polyline fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-linejoin="round" points="60,200 85,185.5 110,140 135,94.5 160,80 185,109.5 210,170 235,230.5 260,260 285,245.5 310,200 335,154.5 360,140 385,169.5 410,230 435,290.5 460,320 485,305.5 510,260 535,214.5 560,200"/>
<polyline fill="none" stroke="#f0a030" stroke-width="2.5" stroke-linejoin="round" points="60,260 85,245.5 110,200 135,154.5 160,140 185,169.5 210,230 235,290.5 260,320 285,305.5 310,260 335,214.5 360,200"/>
<g stroke="#2e8b57" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)">
<line x1="110" y1="145" x2="110" y2="195"/><line x1="210" y1="175" x2="210" y2="225"/><line x1="310" y1="205" x2="310" y2="255"/></g>
<text x="318" y="240" fill="#2e8b57" font-weight="bold">处处正好差 0.4</text>
<circle cx="60" cy="200" r="5" fill="#4a90d9"/><circle cx="560" cy="200" r="5" fill="#4a90d9"/>
<text x="68" y="192" class="s">f(0) = 0</text><text x="552" y="192" class="s" text-anchor="end">f(1) = 0（起点终点一样高）</text>
<line x1="60" y1="382" x2="90" y2="382" stroke="#4a90d9" stroke-width="3"/><text x="96" y="386">f(x)</text>
<line x1="160" y1="382" x2="190" y2="382" stroke="#f0a030" stroke-width="3"/><text x="196" y="386">f(x + 0.4)：把曲线往左挪 0.4 再叠上来比</text>
<text x="20" y="410" class="s">橙线整条比蓝线低 0.4，两条线永远碰不到 → 找不到「相距 0.4 又一样高」的两点，所以 h = 0.4 时结论不成立</text>
</svg>
