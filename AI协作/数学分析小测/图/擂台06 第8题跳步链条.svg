<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290">
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#333}.t{font-size:15px;font-weight:bold}.s{font-size:12px;fill:#666}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/></marker></defs>
<rect width="640" height="290" fill="#fff"/>
<text x="20" y="25" class="t">h = 1/3：每次跳 1/3，跳 3 步正好落在终点 1</text>
<line x1="60" y1="85" x2="540" y2="85" stroke="#888" stroke-width="3"/>
<g fill="none" stroke="#4a90d9" stroke-width="2" marker-end="url(#a)">
<path d="M60,85 Q140,35 220,85"/><path d="M220,85 Q300,35 380,85"/><path d="M380,85 Q460,35 540,85"/></g>
<g fill="#4a90d9"><circle cx="60" cy="85" r="5"/><circle cx="220" cy="85" r="5"/><circle cx="380" cy="85" r="5"/><circle cx="540" cy="85" r="5"/></g>
<g text-anchor="middle"><text x="60" y="105">0</text><text x="220" y="105">1/3</text><text x="380" y="105">2/3</text><text x="540" y="105">1</text></g>
<text x="20" y="128">三段的高度差加起来 = f(1) − f(0) = 0</text>
<text x="20" y="146" fill="#2e8b57">所以有的段为正、有的段为负 → 中间一定能找到差正好为 0 的地方 ✓</text>
<text x="20" y="180" class="t">h = 0.4：跳两步到 0.8，第三步就跳出界了</text>
<line x1="60" y1="235" x2="540" y2="235" stroke="#888" stroke-width="3"/>
<g fill="none" stroke="#4a90d9" stroke-width="2" marker-end="url(#a)">
<path d="M60,235 Q156,185 252,235"/><path d="M252,235 Q348,185 444,235"/></g>
<path d="M444,235 Q532,185 620,235" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#b)"/>
<g fill="#4a90d9"><circle cx="60" cy="235" r="5"/><circle cx="252" cy="235" r="5"/><circle cx="444" cy="235" r="5"/></g>
<circle cx="540" cy="235" r="5" fill="#fff" stroke="#888" stroke-width="2"/>
<g text-anchor="middle"><text x="60" y="255">0</text><text x="252" y="255">0.4</text><text x="444" y="255">0.8</text><text x="540" y="255">1</text><text x="600" y="200" fill="#d9534f">1.2 出界</text></g>
<text x="20" y="280" fill="#d9534f">链条凑不回终点，「加起来等于 0」这招用不上 → 能造出反例 ✗</text>
</svg>
