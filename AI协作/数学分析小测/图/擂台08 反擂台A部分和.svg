<g text-anchor="end"><text x="52" y="64" class="s">1.0</text><text x="52" y="144" class="s">0.9</text><text x="52" y="224" class="s">0.8</text><text x="52" y="304" class="s">0.7</text></g>
<line x1="60" y1="260" x2="500" y2="260" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="60" y1="202" x2="500" y2="202" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="506" y="206" fill="#2e8b57" font-weight="bold">π²/12 ≈ 0.8225 ✓</text>
<text x="506" y="264" fill="#d9534f" font-weight="bold">3/4 = 0.75 ✗</text>
<polyline fill="none" stroke="#4a90d9" stroke-width="2" points="80,60 125,260 170,171.1 215,221.1 260,189.1 305,211.3 350,195 395,207.5 440,197.6 485,205.6"/>
