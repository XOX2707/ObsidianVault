<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <clipPath id="lensClip">
      <circle cx="125" cy="200" r="70"/>
    </clipPath>
    <mask id="unionMask">
      <rect x="360" y="120" width="240" height="160" fill="black"/>
      <circle cx="445" cy="200" r="70" fill="white"/>
      <circle cx="515" cy="200" r="70" fill="white"/>
    </mask>
  </defs>

  <!-- 面板一：交集 -->
  <text x="160" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#7a8699">A ∩ B</text>
  <circle cx="125" cy="200" r="70" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <circle cx="195" cy="200" r="70" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <circle cx="195" cy="200" r="70" fill="#5b8def" fill-opacity="0.42" clip-path="url(#lensClip)"/>
  <text x="98" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#7a8699">A</text>
  <text x="222" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#7a8699">B</text>
  <text x="160" y="335" text-anchor="middle" font-size="16" fill="#7a8699">只算重叠的那一小片</text>

  <!-- 面板二：并集 -->
  <text x="480" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#7a8699">A ∪ B</text>
  <rect x="360" y="120" width="240" height="160" fill="#5b8def" fill-opacity="0.42" mask="url(#unionMask)"/>
  <circle cx="445" cy="200" r="70" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <circle cx="515" cy="200" r="70" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <text x="415" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#7a8699">A</text>
  <text x="545" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#7a8699">B</text>
  <text x="480" y="335" text-anchor="middle" font-size="16" fill="#7a8699">两个圈加起来全算</text>

  <!-- 面板三：不相交 -->
  <text x="800" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#7a8699">A ∩ B = ∅</text>
  <circle cx="722" cy="200" r="62" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <circle cx="878" cy="200" r="62" fill="none" stroke="#7a8699" stroke-width="2.5"/>
  <text x="700" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#7a8699">A</text>
  <text x="900" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#7a8699">B</text>
  <text x="800" y="335" text-anchor="middle" font-size="16" fill="#7a8699">两个圈分开，一点公共部分都没有</text>
</svg>
