<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <!-- 面板一：y = ln u -->
  <text x="235" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a8699">y = ln u</text>
  <rect x="130" y="70" width="300" height="270" fill="#5b8def" fill-opacity="0.10"/>
  <line x1="45" y1="180" x2="430" y2="180" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="60" y1="345" x2="60" y2="70" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="60" y1="70" x2="60" y2="345" stroke="#e05a5a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="425" y="200" font-size="15" fill="#7a8699">u</text>
  <text x="68" y="78" font-size="15" fill="#7a8699">y</text>
  <text x="52" y="196" text-anchor="end" font-size="13" fill="#7a8699">O</text>
  <text x="130" y="198" text-anchor="middle" font-size="13" fill="#7a8699">1</text>
  <text x="270" y="198" text-anchor="middle" font-size="13" fill="#7a8699">3</text>
  <polyline fill="none" stroke="#5b8def" stroke-width="3" points="63.5,330 67,295 74,260.5 81,240 95,214.5 112.5,194.5 130,180 165,159.7 200,145.3 270,125 340,110.7 410,99.5"/>
  <circle cx="130" cy="180" r="4" fill="#5b8def"/>
  <text x="145" y="172" font-size="13" fill="#5b8def">(1, 0)</text>
  <line x1="62" y1="183" x2="425" y2="183" stroke="#5b8def" stroke-width="5" stroke-opacity="0.45"/>
  <text x="235" y="372" text-anchor="middle" font-size="15" fill="#7a8699">定义域 D<tspan baseline-shift="sub" font-size="11">f</tspan> = (0, +∞)，u 必须大于 0</text>
  <text x="70" y="335" font-size="12" fill="#e05a5a">u = 0 是渐近线，碰不到</text>

  <!-- 面板二：u = sin x - 1 -->
  <text x="705" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a8699">u = sin x − 1</text>
  <rect x="485" y="180" width="440" height="100" fill="#e05a5a" fill-opacity="0.12"/>
  <line x1="475" y1="180" x2="935" y2="180" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="345" x2="540" y2="70" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="485" y1="280" x2="925" y2="280" stroke="#e05a5a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="930" y="200" font-size="15" fill="#7a8699">x</text>
  <text x="548" y="78" font-size="15" fill="#7a8699">u</text>
  <text x="532" y="196" text-anchor="end" font-size="13" fill="#7a8699">O</text>
  <text x="532" y="284" text-anchor="end" font-size="13" fill="#e05a5a">−2</text>
  <text x="626" y="172" text-anchor="middle" font-size="13" fill="#7a8699">π/2</text>
  <text x="799" y="300" text-anchor="middle" font-size="13" fill="#7a8699">3π/2</text>
  <polyline fill="none" stroke="#e05a5a" stroke-width="3" points="485,272 512.5,254 540,230 567.5,206 595,188 622.5,180.1 626.4,180 650,184.5 677.5,200.1 705,223 732.5,247.5 760,267.8 799.2,280 815,278 842.5,265.3 870,244 897.5,219 925,197"/>
  <circle cx="626.4" cy="180" r="4" fill="#e05a5a"/>
  <circle cx="799.2" cy="280" r="4" fill="#e05a5a"/>
  <text x="705" y="372" text-anchor="middle" font-size="15" fill="#7a8699">值域 R<tspan baseline-shift="sub" font-size="11">g</tspan> = [−2, 0]，最高只碰到 0</text>
</svg>
