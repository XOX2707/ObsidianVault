<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <!-- ===== 面板一：arcsin x ===== -->
  <text x="200" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#e08a3c">y = arcsin x（反过来查角）</text>

  <line x1="80" y1="220" x2="320" y2="220" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="360" x2="200" y2="70" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="315" y="240" font-size="15" fill="#7a8699">x</text>
  <text x="208" y="80" font-size="15" fill="#7a8699">y</text>
  <text x="192" y="236" text-anchor="end" font-size="13" fill="#7a8699">O</text>

  <line x1="95" y1="110" x2="305" y2="110" stroke="#7a8699" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="95" y1="330" x2="305" y2="330" stroke="#7a8699" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="90" y="114" text-anchor="end" font-size="13" fill="#7a8699">π/2</text>
  <text x="90" y="334" text-anchor="end" font-size="13" fill="#7a8699">−π/2</text>
  <text x="130" y="238" text-anchor="middle" font-size="13" fill="#7a8699">−1</text>
  <text x="270" y="238" text-anchor="middle" font-size="13" fill="#7a8699">1</text>

  <polyline fill="none" stroke="#e08a3c" stroke-width="3.5" points="130,330 133.5,307.7 144,284.9 158,265.1 172,248.8 186,234.1 200,220 214,205.9 228,191.2 242,174.9 256,155.1 266.5,132.3 270,110"/>
  <circle cx="130" cy="330" r="4.5" fill="#e08a3c"/>
  <circle cx="270" cy="110" r="4.5" fill="#e08a3c"/>

  <line x1="235" y1="220" x2="235" y2="183.3" stroke="#3f9b6b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="235" cy="183.3" r="4.5" fill="#3f9b6b"/>
  <text x="243" y="190" font-size="13" fill="#3f9b6b">arcsin ½ = π/6</text>

  <text x="200" y="395" text-anchor="middle" font-size="14" fill="#7a8699">定义域 [−1, 1]，值域 [−π/2, π/2]</text>
  <text x="200" y="418" text-anchor="middle" font-size="14" fill="#7a8699">只有一段，单调递增，有界</text>

  <!-- ===== 面板二：csc x ===== -->
  <text x="700" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#8a5bd6">y = csc x = 1 / sin x（取倒数）</text>

  <!-- 取不到的带 -->
  <rect x="475" y="180" width="455" height="80" fill="#7a8699" fill-opacity="0.10"/>
  <text x="935" y="225" text-anchor="end" font-size="12" fill="#7a8699">(−1, 1) 取不到</text>

  <line x1="470" y1="220" x2="945" y2="220" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="390" x2="700" y2="50" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="940" y="240" font-size="15" fill="#7a8699">x</text>
  <text x="708" y="60" font-size="15" fill="#7a8699">y</text>
  <text x="692" y="236" text-anchor="end" font-size="13" fill="#7a8699">O</text>

  <!-- 渐近线 x = kπ -->
  <line x1="480.1" y1="55" x2="480.1" y2="385" stroke="#e05a5a" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="590" y1="55" x2="590" y2="385" stroke="#e05a5a" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="810" y1="55" x2="810" y2="385" stroke="#e05a5a" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="919.9" y1="55" x2="919.9" y2="385" stroke="#e05a5a" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="480.1" y="400" text-anchor="middle" font-size="12" fill="#e05a5a">−2π</text>
  <text x="590" y="400" text-anchor="middle" font-size="12" fill="#e05a5a">−π</text>
  <text x="810" y="400" text-anchor="middle" font-size="12" fill="#e05a5a">π</text>
  <text x="919.9" y="400" text-anchor="middle" font-size="12" fill="#e05a5a">2π</text>

  <!-- 四段 csc -->
  <polyline fill="none" stroke="#8a5bd6" stroke-width="3" points="488.9,60 492.3,103.4 497.6,136.6 504.6,157.9 515.1,172.5 525.6,178.5 535,180 544.5,178.5 555,172.5 565.5,157.9 572.5,136.6 577.8,103.4 581.2,60"/>
  <polyline fill="none" stroke="#8a5bd6" stroke-width="3" points="598.9,380 602.3,336.6 607.6,303.4 614.6,282.1 625.1,267.5 635.6,261.5 645,260 654.5,261.5 665,267.5 675.5,282.1 682.5,303.4 687.7,336.6 691.2,380"/>
  <polyline fill="none" stroke="#8a5bd6" stroke-width="3" points="708.8,60 712.3,103.4 717.5,136.6 724.5,157.9 735,172.5 745.5,178.5 755,180 764.4,178.5 774.9,172.5 785.4,157.9 792.4,136.6 797.7,103.4 801.1,60"/>
  <polyline fill="none" stroke="#8a5bd6" stroke-width="3" points="818.8,380 822.2,336.6 827.5,303.4 834.5,282.1 845,267.5 855.5,261.5 865,260 874.4,261.5 884.9,267.5 895.4,282.1 902.4,303.4 907.6,336.6 911.1,380"/>

  <circle cx="755" cy="180" r="4" fill="#8a5bd6"/>
  <text x="755" y="198" text-anchor="middle" font-size="12" fill="#8a5bd6">(π/2, 1)</text>
  <circle cx="645" cy="260" r="4" fill="#8a5bd6"/>
  <text x="645" y="250" text-anchor="middle" font-size="12" fill="#8a5bd6">(−π/2, −1)</text>

  <circle cx="718.3" cy="140" r="4.5" fill="#3f9b6b"/>
  <text x="726" y="132" font-size="13" fill="#3f9b6b">csc π/6 = 2</text>

  <text x="700" y="425" text-anchor="middle" font-size="14" fill="#7a8699">x ≠ kπ，值域 (−∞, −1] ∪ [1, +∞)，周期 2π，红线是渐近线</text>
</svg>
