<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <text x="310" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#7a8699">y = ln x 与它的反函数 y = eˣ</text>

  <!-- 坐标轴 -->
  <line x1="45" y1="280" x2="565" y2="280" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="440" x2="250" y2="65" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="300" font-size="15" fill="#7a8699">x</text>
  <text x="258" y="74" font-size="15" fill="#7a8699">y</text>
  <text x="242" y="296" text-anchor="end" font-size="13" fill="#7a8699">O</text>

  <!-- y = x 对称轴 -->
  <line x1="100" y1="430" x2="450" y2="80" stroke="#7a8699" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="455" y="95" font-size="15" fill="#7a8699">y = x</text>

  <!-- y = ln x -->
  <polyline fill="none" stroke="#5b8def" stroke-width="3" points="252.5,430 255,395.1 260,360.5 265,340.2 275,314.7 287.5,294.4 300,280 325,259.7 350,245.3 385.9,230 400,225 450,210.7 500,199.5 550,190.4"/>
  <text x="505" y="185" font-size="16" font-weight="700" fill="#5b8def">y = ln x</text>

  <!-- y = e^x -->
  <polyline fill="none" stroke="#e08a3c" stroke-width="3" points="100,277.5 134.9,275 169.6,270 189.8,265 215.4,255 235.6,242.5 250,230 270.3,205 284.7,180 300,144.1 305,130 319.3,80"/>
  <text x="328" y="88" font-size="16" font-weight="700" fill="#e08a3c">y = eˣ</text>

  <!-- 对称点 (1,0) 与 (0,1) -->
  <line x1="300" y1="280" x2="250" y2="230" stroke="#3f9b6b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="300" cy="280" r="4.5" fill="#5b8def"/>
  <circle cx="250" cy="230" r="4.5" fill="#e08a3c"/>
  <text x="304" y="298" font-size="13" fill="#5b8def">(1, 0)</text>
  <text x="202" y="226" font-size="13" fill="#e08a3c">(0, 1)</text>

  <!-- 对称点 (e,1) 与 (1,e) -->
  <line x1="385.9" y1="230" x2="300" y2="144.1" stroke="#3f9b6b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="385.9" cy="230" r="4.5" fill="#5b8def"/>
  <circle cx="300" cy="144.1" r="4.5" fill="#e08a3c"/>
  <text x="392" y="248" font-size="13" fill="#5b8def">(e, 1)</text>
  <text x="254" y="140" font-size="13" fill="#e08a3c">(1, e)</text>

  <text x="310" y="468" text-anchor="middle" font-size="14" fill="#7a8699">绿色虚线连着的两点横纵坐标互换，关于 y = x 对称</text>
</svg>
