<svg xmlns="http://www.w3.org/2000/svg" width="620" height="450" viewBox="0 0 620 450" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <text x="310" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#7a8699">只留一段 sin x，才有 arcsin x（= sin⁻¹x）</text>

  <!-- 保留区间底色 -->
  <rect x="215.7" y="80" width="188.6" height="320" fill="#5b8def" fill-opacity="0.07"/>

  <!-- 坐标轴 -->
  <line x1="55" y1="250" x2="600" y2="250" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="405" x2="310" y2="70" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="270" font-size="15" fill="#7a8699">x</text>
  <text x="318" y="80" font-size="15" fill="#7a8699">y</text>
  <text x="302" y="266" text-anchor="end" font-size="13" fill="#7a8699">O</text>

  <!-- y = x -->
  <line x1="202" y1="358" x2="430" y2="130" stroke="#7a8699" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="434" y="128" font-size="14" fill="#7a8699">y = x</text>

  <!-- 横线 y = 1/2 -->
  <line x1="60" y1="220" x2="590" y2="220" stroke="#e05a5a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="535" y="212" font-size="13" fill="#e05a5a">y = 1/2</text>
  <circle cx="90.1" cy="220" r="4" fill="#e05a5a"/>
  <circle cx="341.4" cy="220" r="4" fill="#e05a5a"/>
  <circle cx="467.1" cy="220" r="4" fill="#e05a5a"/>

  <!-- 完整 sin x（淡） -->
  <polyline fill="none" stroke="#5b8def" stroke-width="2" stroke-opacity="0.35" points="70,204.6 100,228.9 130,258.5 160,285.9 190,304.5 215.7,310 220,309.8 250,300.5 280,278.7 310,250 340,221.3 370,199.5 400,190.2 404.3,190 430,195.5 460,214.1 490,241.5 520,271.1 550,295.4 580,308.7"/>

  <!-- 保留的那段 sin x -->
  <polyline fill="none" stroke="#5b8def" stroke-width="3.5" points="215.7,310 235,306.9 250,300.5 265,290.9 280,278.7 295,264.8 310,250 325,235.2 340,221.3 355,209.1 370,199.5 385,193.1 404.3,190"/>
  <text x="430" y="186" font-size="15" font-weight="700" fill="#5b8def">y = sin x</text>

  <!-- arcsin x -->
  <polyline fill="none" stroke="#e08a3c" stroke-width="3.5" points="250,344.3 250.2,340 253.1,325 259.5,310 269.1,295 281.3,280 295.2,265 310,250 324.8,235 338.7,220 350.9,205 360.5,190 366.9,175 369.8,160 370,155.7"/>
  <text x="378" y="152" font-size="15" font-weight="700" fill="#e08a3c">y = arcsin x</text>

  <!-- 端点 -->
  <circle cx="404.3" cy="190" r="4" fill="#5b8def"/>
  <circle cx="215.7" cy="310" r="4" fill="#5b8def"/>
  <circle cx="370" cy="155.7" r="4" fill="#e08a3c"/>
  <circle cx="250" cy="344.3" r="4" fill="#e08a3c"/>
  <text x="404" y="176" font-size="12" fill="#5b8def">(π/2, 1)</text>
  <text x="160" y="330" font-size="12" fill="#5b8def">(−π/2, −1)</text>
  <text x="262" y="362" font-size="12" fill="#e08a3c">(−1, −π/2)</text>

  <text x="310" y="420" text-anchor="middle" font-size="14" fill="#7a8699">红线碰到整条 sin x 无数次；只留底色那段 [−π/2, π/2]，它单调，才能翻成 arcsin x</text>
  <text x="310" y="440" text-anchor="middle" font-size="13" fill="#7a8699">注意：sin⁻¹x 是 arcsin x，不是 1/sin x</text>
</svg>
