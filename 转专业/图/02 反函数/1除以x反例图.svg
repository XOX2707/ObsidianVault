<svg xmlns="http://www.w3.org/2000/svg" width="620" height="490" viewBox="0 0 620 490" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <text x="310" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#7a8699">y = 1/x：有反函数，但不是单调函数</text>

  <!-- 坐标轴 -->
  <line x1="45" y1="240" x2="580" y2="240" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="450" x2="310" y2="38" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="260" font-size="15" fill="#7a8699">x</text>
  <text x="318" y="50" font-size="15" fill="#7a8699">y</text>
  <text x="302" y="256" text-anchor="end" font-size="13" fill="#7a8699">O</text>

  <!-- y = x -->
  <line x1="110" y1="440" x2="510" y2="40" stroke="#7a8699" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="515" y="52" font-size="14" fill="#7a8699">y = x</text>

  <!-- 横线 y = 2 -->
  <line x1="55" y1="140" x2="575" y2="140" stroke="#5b8def" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="60" y="132" font-size="13" fill="#5b8def">任意横线只碰一次 → 一一对应</text>
  <circle cx="335" cy="140" r="4.5" fill="#5b8def"/>

  <!-- 两段曲线 -->
  <polyline fill="none" stroke="#8a5bd6" stroke-width="3" points="322.5,40 325,73.3 330,115 335,140 347.5,173.3 360,190 385,206.7 410,215 460,223.3 510,227.5 560,230"/>
  <polyline fill="none" stroke="#8a5bd6" stroke-width="3" points="297.5,440 295,406.7 290,365 285,340 272.5,306.7 260,290 235,273.3 210,265 160,256.7 110,252.5 60,250"/>
  <text x="470" y="210" font-size="13" fill="#8a5bd6">这段递减</text>
  <text x="95" y="285" font-size="13" fill="#8a5bd6">这段也递减</text>

  <!-- 对比点 -->
  <circle cx="260" cy="290" r="4.5" fill="#e05a5a"/>
  <circle cx="360" cy="190" r="4.5" fill="#e05a5a"/>
  <text x="200" y="312" font-size="13" fill="#e05a5a">f(−1) = −1</text>
  <text x="368" y="186" font-size="13" fill="#e05a5a">f(1) = 1</text>

  <text x="310" y="470" text-anchor="middle" font-size="14" fill="#7a8699">−1 &lt; 1 时 f(−1) &lt; f(1)，又像递增，整体说不出增减；中间在 x = 0 断开</text>
</svg>
