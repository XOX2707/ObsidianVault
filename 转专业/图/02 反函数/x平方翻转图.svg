<svg xmlns="http://www.w3.org/2000/svg" width="620" height="490" viewBox="0 0 620 490" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <text x="310" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#7a8699">y = x² 沿 y = x 翻过去，变成 x = y²</text>

  <!-- 坐标轴 -->
  <line x1="55" y1="280" x2="570" y2="280" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="445" x2="290" y2="62" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="565" y="300" font-size="15" fill="#7a8699">x</text>
  <text x="298" y="72" font-size="15" fill="#7a8699">y</text>
  <text x="282" y="296" text-anchor="end" font-size="13" fill="#7a8699">O</text>

  <!-- y = x -->
  <line x1="132.5" y1="437.5" x2="483.5" y2="86.5" stroke="#7a8699" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="440" y="82" font-size="15" fill="#7a8699">y = x</text>

  <!-- 水平线 y = 4 -->
  <line x1="150" y1="100" x2="430" y2="100" stroke="#5b8def" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="105" y="105" font-size="13" fill="#5b8def">y = 4</text>

  <!-- 竖线 x = 4 -->
  <line x1="470" y1="150" x2="470" y2="410" stroke="#e08a3c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="478" y="425" font-size="13" fill="#e08a3c">x = 4</text>

  <!-- y = x^2 -->
  <polyline fill="none" stroke="#5b8def" stroke-width="3" points="195.5,81.6 200,100 222.5,178.75 245,235 267.5,268.75 290,280 312.5,268.75 335,235 357.5,178.75 380,100 384.5,81.6"/>
  <text x="160" y="190" font-size="16" font-weight="700" fill="#5b8def">y = x²</text>

  <!-- x = y^2 -->
  <polyline fill="none" stroke="#e08a3c" stroke-width="3" points="488.5,374.5 470,370 391.25,347.5 335,325 301.25,302.5 290,280 301.25,257.5 335,235 391.25,212.5 470,190 488.5,185.5"/>
  <text x="500" y="250" font-size="16" font-weight="700" fill="#e08a3c">x = y²</text>

  <!-- 对称点连线 -->
  <line x1="380" y1="100" x2="470" y2="190" stroke="#3f9b6b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="200" y1="100" x2="470" y2="370" stroke="#3f9b6b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 交点 -->
  <circle cx="200" cy="100" r="4.5" fill="#5b8def"/>
  <circle cx="380" cy="100" r="4.5" fill="#5b8def"/>
  <circle cx="470" cy="190" r="4.5" fill="#e08a3c"/>
  <circle cx="470" cy="370" r="4.5" fill="#e08a3c"/>
  <text x="168" y="92" font-size="13" fill="#5b8def">(−2, 4)</text>
  <text x="388" y="94" font-size="13" fill="#5b8def">(2, 4)</text>
  <text x="478" y="184" font-size="13" fill="#e08a3c">(4, 2)</text>
  <text x="478" y="368" font-size="13" fill="#e08a3c">(4, −2)</text>

  <!-- 不动点 -->
  <circle cx="290" cy="280" r="4" fill="#3f9b6b"/>
  <circle cx="335" cy="235" r="4" fill="#3f9b6b"/>
  <text x="343" y="232" font-size="13" fill="#3f9b6b">(1, 1) 在 y = x 上，不动</text>

  <text x="310" y="470" text-anchor="middle" font-size="14" fill="#7a8699">蓝：横线碰两次，没有反函数　橙：竖线碰两次，不是函数</text>
</svg>
