<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b8def"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05a5a"/>
    </marker>
  </defs>

  <!-- 分隔线 -->
  <line x1="320" y1="30" x2="320" y2="300" stroke="#7a8699" stroke-opacity="0.35" stroke-dasharray="4 6"/>
  <line x1="640" y1="30" x2="640" y2="300" stroke="#7a8699" stroke-opacity="0.35" stroke-dasharray="4 6"/>

  <!-- 面板一：remove -->
  <text x="160" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#5b8def">remove</text>
  <text x="160" y="74" text-anchor="middle" font-size="15" fill="#7a8699">re- 离开 + move 移动</text>
  <rect x="45" y="200" width="130" height="8" rx="2" fill="#7a8699"/>
  <line x1="60" y1="208" x2="60" y2="240" stroke="#7a8699" stroke-width="4"/>
  <line x1="160" y1="208" x2="160" y2="240" stroke="#7a8699" stroke-width="4"/>
  <rect x="95" y="160" width="32" height="40" rx="4" fill="none" stroke="#7a8699" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M130,165 Q190,110 236,160" fill="none" stroke="#5b8def" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="240" y="160" width="32" height="40" rx="4" fill="#5b8def" fill-opacity="0.35" stroke="#5b8def" stroke-width="2"/>
  <text x="160" y="270" text-anchor="middle" font-size="16" fill="#7a8699">从原来的地方拿走</text>
  <text x="160" y="294" text-anchor="middle" font-size="16" fill="#7a8699">东西还在，只是换了地方</text>

  <!-- 面板二：eliminate -->
  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#e05a5a">eliminate</text>
  <text x="480" y="74" text-anchor="middle" font-size="15" fill="#7a8699">e- 出 + limin 门槛 + -ate</text>
  <rect x="458" y="105" width="44" height="100" fill="none" stroke="#7a8699" stroke-width="2"/>
  <line x1="440" y1="206" x2="520" y2="206" stroke="#e05a5a" stroke-width="6"/>
  <text x="480" y="228" text-anchor="middle" font-size="13" fill="#e05a5a">limin 门槛</text>
  <circle cx="365" cy="185" r="12" fill="#5b8def" fill-opacity="0.35" stroke="#5b8def" stroke-width="2"/>
  <circle cx="400" cy="185" r="12" fill="#5b8def" fill-opacity="0.35" stroke="#5b8def" stroke-width="2"/>
  <circle cx="382" cy="155" r="12" fill="#5b8def" fill-opacity="0.35" stroke="#5b8def" stroke-width="2"/>
  <line x1="425" y1="170" x2="548" y2="170" stroke="#e05a5a" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <circle cx="580" cy="170" r="14" fill="none" stroke="#e05a5a" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="570" y1="160" x2="590" y2="180" stroke="#e05a5a" stroke-width="2.5"/>
  <line x1="590" y1="160" x2="570" y2="180" stroke="#e05a5a" stroke-width="2.5"/>
  <text x="480" y="270" text-anchor="middle" font-size="16" fill="#7a8699">赶出门槛之外</text>
  <text x="480" y="294" text-anchor="middle" font-size="16" fill="#7a8699">结果：不再存在，或不再算数</text>

  <!-- 面板三：terminate -->
  <text x="800" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#3f9b6b">terminate</text>
  <text x="800" y="74" text-anchor="middle" font-size="15" fill="#7a8699">termin 边界、终点 + -ate</text>
  <line x1="675" y1="170" x2="880" y2="170" stroke="#3f9b6b" stroke-width="4"/>
  <line x1="715" y1="162" x2="715" y2="178" stroke="#3f9b6b" stroke-width="2"/>
  <line x1="755" y1="162" x2="755" y2="178" stroke="#3f9b6b" stroke-width="2"/>
  <line x1="795" y1="162" x2="795" y2="178" stroke="#3f9b6b" stroke-width="2"/>
  <line x1="835" y1="162" x2="835" y2="178" stroke="#3f9b6b" stroke-width="2"/>
  <line x1="880" y1="135" x2="880" y2="205" stroke="#3f9b6b" stroke-width="6"/>
  <line x1="886" y1="170" x2="935" y2="170" stroke="#7a8699" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="675" y="198" text-anchor="middle" font-size="13" fill="#7a8699">开始</text>
  <text x="880" y="126" text-anchor="middle" font-size="13" fill="#3f9b6b">termin 终点</text>
  <text x="800" y="270" text-anchor="middle" font-size="16" fill="#7a8699">一段持续的事正式到头</text>
  <text x="800" y="294" text-anchor="middle" font-size="16" fill="#7a8699">合同、雇佣、进程、服务</text>
</svg>
