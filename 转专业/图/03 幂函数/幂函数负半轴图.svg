<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>

  <text x="310" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#7a8699">幂函数在 x &lt; 0 有没有定义：看分母奇偶</text>

  <!-- 负半轴底色 -->
  <rect x="60" y="50" width="250" height="350" fill="#7a8699" fill-opacity="0.06"/>
  <text x="185" y="395" text-anchor="middle" font-size="13" fill="#7a8699">x &lt; 0</text>

  <!-- 坐标轴 -->
  <line x1="55" y1="240" x2="570" y2="240" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="405" x2="310" y2="48" stroke="#7a8699" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="565" y="260" font-size="15" fill="#7a8699">x</text>
  <text x="318" y="58" font-size="15" fill="#7a8699">y</text>
  <text x="302" y="256" text-anchor="end" font-size="13" fill="#7a8699">O</text>
  <text x="370" y="258" text-anchor="middle" font-size="12" fill="#7a8699">1</text>
  <text x="250" y="258" text-anchor="middle" font-size="12" fill="#7a8699">−1</text>

  <!-- x^(1/2) -->
  <polyline fill="none" stroke="#e05a5a" stroke-width="3" points="310,240 313,226.6 325,210 340,197.6 370,180 430,155.1 490,136.1 550,120"/>
  <text x="520" y="112" font-size="14" font-weight="700" fill="#e05a5a">x^(1/2)</text>

  <!-- x^(1/3) -->
  <polyline fill="none" stroke="#5b8def" stroke-width="3" points="70,335.2 130,326.5 190,315.6 250,300 280,287.6 295,277.8 307,262.1 309.4,252.9 310,240 310.6,227.1 313,217.9 325,202.2 340,192.4 370,180 430,164.4 490,153.5 550,144.8"/>
  <text x="520" y="172" font-size="14" font-weight="700" fill="#5b8def">x^(1/3)</text>
  <text x="80" y="355" font-size="14" font-weight="700" fill="#5b8def">x^(1/3)</text>

  <!-- x^(2/3) -->
  <polyline fill="none" stroke="#3f9b6b" stroke-width="3" points="70,88.8 130,115.2 190,144.8 250,180 280,202.2 295,216.2 307,231.8 309.4,237.2 310,240 310.6,237.2 313,231.8 325,216.2 340,202.2 370,180 430,144.8 490,115.2 550,88.8"/>
  <text x="510" y="80" font-size="14" font-weight="700" fill="#3f9b6b">x^(2/3)</text>
  <text x="75" y="80" font-size="14" font-weight="700" fill="#3f9b6b">x^(2/3)</text>

  <circle cx="370" cy="180" r="4" fill="#7a8699"/>
  <text x="378" y="176" font-size="12" fill="#7a8699">(1, 1) 三条都过</text>

  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#e05a5a">x^(1/2) 左边没有曲线</text>

  <text x="310" y="430" text-anchor="middle" font-size="14" fill="#7a8699">分母 3 是奇数：x^(1/3)、x^(2/3) 左右都有；分母 2 是偶数：x^(1/2) 只有右半</text>
  <text x="310" y="452" text-anchor="middle" font-size="13" fill="#7a8699">不管 μ 是多少，(0, +∞) 上一定有定义</text>
</svg>
