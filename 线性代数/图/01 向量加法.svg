<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" font-family="sans-serif" font-size="15">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="420" height="400" rx="12" fill="#fafaf9"/>
  <!-- grid: 1 unit = 50px, origin at (100,260) -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="50" y1="60" x2="50" y2="360"/><line x1="150" y1="60" x2="150" y2="360"/><line x1="200" y1="60" x2="200" y2="360"/>
    <line x1="250" y1="60" x2="250" y2="360"/><line x1="300" y1="60" x2="300" y2="360"/><line x1="350" y1="60" x2="350" y2="360"/>
    <line x1="50" y1="60" x2="350" y2="60"/><line x1="50" y1="110" x2="350" y2="110"/><line x1="50" y1="160" x2="350" y2="160"/>
    <line x1="50" y1="210" x2="350" y2="210"/><line x1="50" y1="310" x2="350" y2="310"/><line x1="50" y1="360" x2="350" y2="360"/>
  </g>
  <g stroke="#a3a3a3" stroke-width="1.5">
    <line x1="40" y1="260" x2="365" y2="260"/>
    <line x1="100" y1="50" x2="100" y2="370"/>
  </g>
  <g fill="#737373" font-size="12">
    <text x="146" y="276">1</text><text x="196" y="276">2</text><text x="246" y="276">3</text><text x="296" y="276">4</text>
    <text x="86" y="214">1</text><text x="86" y="164">2</text><text x="86" y="114">3</text><text x="82" y="314">-1</text>
    <text x="370" y="264">x</text><text x="96" y="44">y</text>
  </g>
  <!-- dashed copies: w starting at tip of v, v starting at tip of w -->
  <line x1="150" y1="160" x2="297" y2="209" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-orange)"/>
  <line x1="250" y1="310" x2="299" y2="213" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-blue)"/>
  <!-- v, w, v+w from origin -->
  <line x1="100" y1="260" x2="149" y2="163" stroke="#2563eb" stroke-width="3" marker-end="url(#a-blue)"/>
  <line x1="100" y1="260" x2="247" y2="309" stroke="#ea580c" stroke-width="3" marker-end="url(#a-orange)"/>
  <line x1="100" y1="260" x2="297" y2="211" stroke="#16a34a" stroke-width="3" marker-end="url(#a-green)"/>
  <circle cx="100" cy="260" r="3.5" fill="#404040"/>
  <text x="58" y="148" fill="#2563eb" font-weight="bold">v = (1, 2)</text>
  <text x="196" y="340" fill="#ea580c" font-weight="bold">w = (3, -1)</text>
  <text x="306" y="204" fill="#16a34a" font-weight="bold">v + w</text>
  <text x="306" y="222" fill="#16a34a">= (4, 1)</text>
  <text x="20" y="390" fill="#525252" font-size="12">实线都从原点出发，虚线是把 w（或 v）平移到另一个箭头的尖上</text>
</svg>
